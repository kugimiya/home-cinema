# Integration test runner (requires Docker).
# Usage: docker compose -f docker-compose.yml -f compose.test.yml run --rm test-runner

services:
  test-runner:
    image: node:22-bookworm
    working_dir: /work
    volumes:
      - .:/work
    command: >
      bash -c "
        apt-get update -qq && apt-get install -y -qq libtorrent-rasterbar-dev pkg-config build-essential curl ca-certificates python3 &&
        cd torrent-engine && npm ci && npm test &&
        cd ../orchestrator && npm ci && npm test &&
        cd ../transcoder && npm ci && npm test
      "
