services:
  torapi:
    image: lifailon/torapi:latest
    build:
      context: ./torapi
    container_name: home-cinema-torapi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      PROXY_ADDRESS: ${PROXY_ADDRESS:-}
      PROXY_PORT: ${PROXY_PORT:-}
      USERNAME: ${PROXY_USERNAME:-}
      PASSWORD: ${PROXY_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8443/api/provider/list').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  torrent-engine:
    build:
      context: ./torrent-engine
    container_name: home-cinema-torrent-engine
    restart: unless-stopped
    init: true
    mem_limit: 3g
    ports:
      - "8090:8090"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    env_file:
      - .env
    environment:
      TORRENT_ENGINE_SAVE_PATH: /torrents
      TORRENT_ENGINE_PORT: 8090
    volumes:
      - ./data/torrents:/torrents
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  transcoder:
    build:
      context: ./transcoder
    container_name: home-cinema-transcoder
    restart: unless-stopped
    mem_limit: ${TRANSCODER_MEM_LIMIT:-4g}
    ports:
      - "${TRANSCODER_PORT:-8091}:8091"
    environment:
      TR_TORRENTS_PATH: /torrents
      TR_WORK_DIR: /transcode
      TR_MAX_SESSIONS: ${TRANSCODE_MAX_SESSIONS:-4}
      TR_TORRENT_ENGINE_URL: http://torrent-engine:8090
    volumes:
      - ./data/torrents:/torrents
      - transcode-cache:/transcode
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  orchestrator:
    build:
      context: ./orchestrator
    container_name: home-cinema-orchestrator
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      TORAPI_URL: ${TORAPI_URL:-http://torapi:8443}
      TORRENT_ENGINE_URL: ${TORRENT_ENGINE_URL:-http://torrent-engine:8090}
      TORRENT_ENGINE_PUBLIC_URL: ${TORRENT_ENGINE_PUBLIC_URL:-http://localhost:3000}
      TRANSCODER_URL: ${TRANSCODER_URL:-http://transcoder:8091}
      TRANSCODER_ENABLED: ${TRANSCODER_ENABLED:-true}
      TORRENT_ENGINE_SAVE_PATH: ${TORRENT_ENGINE_SAVE_PATH:-/torrents}
      TORRENT_ENGINE_LIST_TIMEOUT: ${TORRENT_ENGINE_LIST_TIMEOUT:-45}
      TORRENT_ENGINE_CONNECTIONS_LIMIT: ${TORRENT_ENGINE_CONNECTIONS_LIMIT:-500}
      TORRENT_ENGINE_PRIORITY_CONCURRENCY: ${TORRENT_ENGINE_PRIORITY_CONCURRENCY:-4}
      COMPLETE_SCOPE: ${COMPLETE_SCOPE:-active_only}
      DATABASE_PATH: /data/orchestrator.sqlite3
      ORCHESTRATOR_PUBLIC_URL: ${ORCHESTRATOR_PUBLIC_URL:-http://localhost:3000}
      TRANSCODE_ENABLED: ${TRANSCODE_ENABLED:-true}
      TRANSCODE_WORK_DIR: ${TRANSCODE_WORK_DIR:-/transcode}
      TRANSCODE_MAX_SESSIONS: ${TRANSCODE_MAX_SESSIONS:-4}
      TRANSCODE_SESSION_TTL_SEC: ${TRANSCODE_SESSION_TTL_SEC:-300}
      TRANSCODE_ALLOW_HEVC_DIRECT: ${TRANSCODE_ALLOW_HEVC_DIRECT:-false}
      PROBE_WARM_BYTES: ${PROBE_WARM_BYTES:-4194304}
      PROBE_WARM_FILES: ${PROBE_WARM_FILES:-2}
      PROBE_WARM_MANUAL_FILES: ${PROBE_WARM_MANUAL_FILES:--1}
      PROBE_WARM_CONCURRENCY: ${PROBE_WARM_CONCURRENCY:-1}
      SERVICE_RESTART_ENABLED: ${SERVICE_RESTART_ENABLED:-false}
      DISCOVERY_MDNS_ENABLED: ${DISCOVERY_MDNS_ENABLED:-false}
      DOCKER_CONTAINER_TORRENT_ENGINE: ${DOCKER_CONTAINER_TORRENT_ENGINE:-home-cinema-torrent-engine}
      DOCKER_CONTAINER_TRANSCODER: ${DOCKER_CONTAINER_TRANSCODER:-home-cinema-transcoder}
      DOCKER_CONTAINER_TORAPI: ${DOCKER_CONTAINER_TORAPI:-home-cinema-torapi}
      DOCKER_CONTAINER_ORCHESTRATOR: ${DOCKER_CONTAINER_ORCHESTRATOR:-home-cinema-orchestrator}
    volumes:
      - ./data/orchestrator:/data
      - ./data/torrents:/torrents
      - transcode-cache:${TRANSCODE_WORK_DIR:-/transcode}
    depends_on:
      torrent-engine:
        condition: service_healthy
      transcoder:
        condition: service_healthy
      torapi:
        condition: service_started

  web:
    build:
      context: ./web
    container_name: home-cinema-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - orchestrator

volumes:
  transcode-cache:
