services:
  torapi:
    image: lifailon/torapi:latest
    build:
      context: ./torapi
    container_name: home-cinema-torapi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      PROXY_ADDRESS: ${PROXY_ADDRESS:-}
      PROXY_PORT: ${PROXY_PORT:-}
      USERNAME: ${PROXY_USERNAME:-}
      PASSWORD: ${PROXY_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8443/api/provider/list').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  torrserver:
    build:
      context: ./torrserver
    container_name: home-cinema-torrserver
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data/torrserver-config:/config
      - ./data/torrents:/torrents
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  orchestrator:
    build:
      context: ./orchestrator
    container_name: home-cinema-orchestrator
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      TORAPI_URL: ${TORAPI_URL:-http://torapi:8443}
      TORRSERVER_URL: ${TORRSERVER_URL:-http://torrserver:8090}
      TORRSERVER_PUBLIC_URL: ${TORRSERVER_PUBLIC_URL:-http://localhost:8090}
      TORRENTS_SAVE_PATH: ${TORRENTS_SAVE_PATH:-/torrents}
      TORRSERVER_DATA_PATH: ${TORRSERVER_DATA_PATH:-/torrserver-data}
      DATABASE_PATH: /data/orchestrator.sqlite3
    volumes:
      - ./data/orchestrator:/data
      - ./data/torrents:/torrents
    depends_on:
      torrserver:
        condition: service_healthy
      torapi:
        condition: service_started

  web:
    build:
      context: ./web
    container_name: home-cinema-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - orchestrator
