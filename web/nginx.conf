# Docker embeds DNS at 127.0.0.11. proxy_pass with a hostname variable re-resolves
# on each request; a plain hostname is cached at nginx startup (502 after recreate).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/transcode/ {
        set $upstream http://orchestrator:8080$request_uri;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/play/select {
        set $upstream http://orchestrator:8080$request_uri;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        set $upstream http://orchestrator:8080$request_uri;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /stream/ {
        set $upstream http://torrent-engine:8090$request_uri;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /health {
        set $upstream http://orchestrator:8080/health;
        proxy_pass $upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
